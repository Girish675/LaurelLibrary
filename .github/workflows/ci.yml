name: CI - Validate HTML & Links

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install html-validate
        run: npm install -g html-validate

      - name: Validate static HTML pages
        run: |
          html-validate index.html about.html formulas.html \
            dashboard.html \
            notes/index.html exams/index.html \
            subjects/index.html resources/index.html \
            tools/index.html tools/pomodoro.html \
            tools/flashcards.html tools/gpa-calculator.html \
            tools/planner.html

      - name: Check for broken internal links
        run: |
          echo "Checking internal link targets..."
          errors=0
          for file in $(find . -name '*.html' -not -path './.git/*'); do
            dir=$(dirname "$file")
            # Extract href values pointing to local files (skip external/site-absolute/special schemes)
            while read -r link; do
              [ -z "$link" ] && continue
              case "$link" in
                http*|//*|/*|mailto:*|tel:*|javascript:*|data:*) continue ;;
              esac
              # Skip anything that is not a plain file path (e.g. JS template fragments inside <script>)
              case "$link" in
                *[!A-Za-z0-9_./%~-]*) continue ;;
              esac
              target="$dir/$link"
              if [ ! -f "$target" ] && [ ! -f "$link" ]; then
                echo "BROKEN: $file -> $link"
                errors=$((errors+1))
              fi
            done < <(grep -oP 'href="\K[^"#]+' "$file" 2>/dev/null)
          done
          if [ "$errors" -gt 0 ]; then
            echo "Found $errors broken links"
            exit 1
          fi
          echo "All internal links valid."

      - name: Validate JSON files
        run: |
          for f in notes/index.json search-index.json manifest.json; do
            if [ -f "$f" ]; then
              python3 -m json.tool "$f" > /dev/null && echo "Valid: $f" || { echo "Invalid JSON: $f"; exit 1; }
            fi
          done

      - name: Validate sitemap.xml
        run: |
          if [ -f "sitemap.xml" ]; then
            python3 -c "
          import xml.etree.ElementTree as ET
          tree = ET.parse('sitemap.xml')
          urls = tree.findall('.//{http://www.sitemaps.org/schemas/sitemap/0.9}url')
          print(f'sitemap.xml valid: {len(urls)} URLs')
          "
          fi
