<!DOCTYPE html>
<html lang="en-IN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Subjects — Laurel Library</title>
    <meta name="description" content="Browse study material by subject — Mathematics, Science, Geography, History, Polity, Economics, Reasoning, Aptitude, Computer Science and more.">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self';">
    <link rel="canonical" href="https://girish675.github.io/LaurelLibrary/subjects/">
    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="manifest" href="../manifest.json">
    <meta name="theme-color" content="#0f3460">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
    <script src="../assets/js/components.js"></script>
    <script>document.write(LL.renderHeader('subjects'));document.write(LL.renderSearchModal());</script>

    <main id="main-content">
        <section class="section">
            <div class="container">
                <nav class="breadcrumbs" aria-label="Breadcrumb"><a href="../index.html">Home</a><span>/</span><span>Subjects</span></nav><h1 class="section-title">Subjects</h1>
                <p class="section-subtitle">Explore study material organized by subject area</p>
                <div class="card-grid" id="subjects-grid"></div>
            </div>
        </section>
    </main>

    <script>document.write(LL.renderFooter());</script>
    <script src="../assets/js/search.js" defer></script>
    <script>
    (function() {
        var subjects = [
            { id:'geography', name:'Geography', icon:'🌍', desc:'Physical, human, economic & Indian geography', topics:['Physical Geography','Indian Geography','World Geography','Climatology','Oceanography'] },
            { id:'history', name:'History', icon:'📜', desc:'Ancient, medieval, modern India & world history', topics:['Ancient India','Medieval India','Modern India','World History','Art & Culture'] },
            { id:'polity', name:'Indian Polity', icon:'⚖️', desc:'Constitution, governance, judiciary & public administration', topics:['Constitution','Parliament','Judiciary','Governance','Panchayati Raj'] },
            { id:'economics', name:'Economics', icon:'📊', desc:'Indian economy, microeconomics, macroeconomics', topics:['Indian Economy','Banking','Budget','International Trade','Economic Surveys'] },
            { id:'science', name:'General Science', icon:'🔬', desc:'Physics, chemistry, biology for competitive exams', topics:['Physics','Chemistry','Biology','Environment','Space Science'] },
            { id:'mathematics', name:'Mathematics', icon:'📐', desc:'Algebra, geometry, calculus, number systems', topics:['Algebra','Geometry','Trigonometry','Calculus','Statistics'] },
            { id:'reasoning', name:'Reasoning', icon:'🧩', desc:'Logical, analytical & verbal reasoning', topics:['Logical Reasoning','Analytical Reasoning','Verbal Reasoning','Non-Verbal','Data Interpretation'] },
            { id:'aptitude', name:'Quantitative Aptitude', icon:'🧮', desc:'Number systems, arithmetic, data interpretation', topics:['Number System','Percentage','Profit & Loss','Time & Work','Data Interpretation'] },
            { id:'english', name:'English', icon:'📝', desc:'Grammar, vocabulary, comprehension, essay writing', topics:['Grammar','Vocabulary','Comprehension','Para Jumbles','Error Spotting'] },
            { id:'current-affairs', name:'Current Affairs', icon:'📰', desc:'Daily, monthly & yearly current events', topics:['National','International','Economy','Science & Tech','Awards & Honours'] },
            { id:'general-knowledge', name:'General Knowledge', icon:'💡', desc:'Static GK, general awareness, facts & figures', topics:['Indian Polity','Geography','History','Science','Awards'] },
            { id:'computer-science', name:'Computer Science', icon:'💻', desc:'Data structures, algorithms, OS, databases, networks', topics:['DSA','Operating Systems','DBMS','Computer Networks','Theory of Computation'] },
            { id:'analog-electronics', name:'Analog Electronics', icon:'📻', desc:'Diodes, BJTs, Op-Amps, Oscillators', topics:['Diodes', 'BJTs', 'MOSFET', 'Op-Amps', 'Oscillators'] },
            { id:'communications', name:'Communications', icon:'📡', desc:'Analog & digital communication systems', topics:['AM', 'FM', 'Digital Modulation', 'Information Theory'] },
            { id:'control-systems', name:'Control Systems', icon:'🎛️', desc:'System stability, root locus, bode plots', topics:['Transfer Functions', 'Stability', 'Root Locus', 'State Space'] },
            { id:'digital-electronics', name:'Digital Electronics', icon:'🔢', desc:'Logic gates, combinational & sequential circuits', topics:['Logic Gates', 'Boolean Algebra', 'Sequential Circuits', 'ADC/DAC'] },
            { id:'edc', name:'Electronic Devices & Circuits', icon:'🔬', desc:'Semiconductor physics, PN junctions, special diodes', topics:['Semiconductors', 'PN Junction', 'BJT', 'FET'] },
            { id:'emft', name:'Electromagnetic Field Theory', icon:'🧲', desc:'Maxwell equations, transmission lines, antennas', topics:['Electrostatics', 'Magnetostatics', 'Waveguides', 'Antennas'] },
            { id:'network-theory', name:'Network Theory', icon:'🔌', desc:'Circuit analysis, theorems, two-port networks', topics:['Network Theorems', 'Transient Analysis', 'Two Port Networks', 'Graph Theory'] },
            { id:'signals-and-systems', name:'Signals and Systems', icon:'〰️', desc:'Continuous & discrete time signals, transforms', topics:['LTI Systems', 'Fourier Transform', 'Laplace Transform', 'Z-Transform'] },
            { id:'electrical', name:'Electrical Engineering', icon:'⚡', desc:'Power systems, machines, control, circuits', topics:['Power Systems','Electrical Machines','Control Systems','Circuit Theory','Power Electronics'] },
            { id:'mechanical', name:'Mechanical Engineering', icon:'🔧', desc:'Thermodynamics, mechanics, manufacturing, design', topics:['Thermodynamics','Fluid Mechanics','Strength of Materials','Manufacturing','Machine Design'] },
            { id:'civil', name:'Civil Engineering', icon:'🏗️', desc:'Structures, geotechnical, transportation, water resources', topics:['Structural Engineering','Geotechnical','Transportation','Water Resources','Environmental'] }
        ];

        function render(counts) {
            var grid = document.getElementById('subjects-grid');
            if (!grid) return;
            counts = counts || {};
            grid.innerHTML = subjects.map(function(s) {
                var count = counts[s.id] || 0;
                var countLabel = count > 0
                    ? '<span class="tag" style="background:rgba(27,138,90,0.12);color:var(--c-accent)">' + count + ' note' + (count === 1 ? '' : 's') + '</span>'
                    : '<span class="tag" style="opacity:.6">Coming soon</span>';
                var href = '../notes/index.html?category=' + encodeURIComponent(s.id);
                return '<a href="' + href + '" class="category-card" style="align-items:flex-start;flex-direction:column;padding:var(--space-lg)">' +
                    '<div style="display:flex;align-items:center;gap:var(--space-sm);margin-bottom:var(--space-sm)">' +
                    '<span style="font-size:2rem">' + s.icon + '</span>' +
                    '<h3 style="margin:0;font-size:var(--text-md)">' + s.name + '</h3></div>' +
                    '<p style="color:var(--c-text-secondary);font-size:var(--text-sm);margin:0 0 var(--space-sm)">' + s.desc + '</p>' +
                    '<div class="exam-tags">' + s.topics.slice(0,3).map(function(t) { return '<span class="tag">' + t + '</span>'; }).join('') + '</div>' +
                    '<div style="margin-top:var(--space-sm)">' + countLabel + '</div></a>';
            }).join('');
        }

        function loadCounts() {
            fetch('../notes/index.json?v=' + Date.now())
                .then(function(r) { return r.ok ? r.json() : { notes: [] }; })
                .then(function(data) {
                    var notes = data.notes || [];
                    var counts = {};
                    subjects.forEach(function(s) {
                        counts[s.id] = notes.filter(function(n) { return n.category === s.id; }).length;
                    });
                    render(counts);
                })
                .catch(function() { render({}); });
        }

        document.addEventListener('DOMContentLoaded', function() { render({}); loadCounts(); LL.init(); });
    })();
    </script>
</body>
</html>
