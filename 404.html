<!DOCTYPE html>
<html lang="en-IN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found — Laurel Library</title>
    <meta name="robots" content="noindex, follow">
    <meta name="theme-color" content="#0f3460">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root{--navy:#0f3460;--green:#1b8a5a;--gold:#f39c12;--bg:#f8f9fa;--muted:#636e72}
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--navy);min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;padding:2rem}
        .box{max-width:480px}
        .code{font-size:6rem;font-weight:800;line-height:1;color:var(--navy);letter-spacing:-0.03em}
        .code span{color:var(--green)}
        h1{font-size:1.5rem;font-weight:700;margin:1rem 0 0.5rem}
        p{color:var(--muted);font-size:1rem;line-height:1.6;margin-bottom:2rem}
        .actions{display:flex;gap:0.75rem;justify-content:center;flex-wrap:wrap}
        a.btn{display:inline-block;padding:0.75rem 1.5rem;border-radius:10px;font-weight:600;font-size:0.95rem;text-decoration:none;transition:transform .15s ease,box-shadow .15s ease}
        a.primary{background:var(--navy);color:#fff}
        a.primary:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(15,52,96,0.25)}
        a.secondary{background:#fff;color:var(--navy);border:1px solid #dfe6e9}
        a.secondary:hover{border-color:var(--green);color:var(--green)}
    </style>
</head>
<body>
    <div class="box">
        <div class="code">4<span>0</span>4</div>
        <h1>Page Not Found</h1>
        <p>The page you're looking for doesn't exist or may have moved. Let's get you back to studying.</p>
        <div class="actions">
            <a class="btn primary" href="/LaurelLibrary/index.html">Go Home</a>
            <a class="btn secondary" href="/LaurelLibrary/notes/index.html">Browse Notes</a>
        </div>
    </div>
</body>
</html>
