<!DOCTYPE html>
<html lang="en-IN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exam Preparation — Laurel Library</title>
    <meta name="description" content="Prepare for UPSC, SSC, GATE, Banking, Railways, Defence, ISRO, DRDO, BARC and more competitive exams with free study material.">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self';">
    <link rel="canonical" href="https://girish675.github.io/LaurelLibrary/exams/">
    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="manifest" href="../manifest.json">
    <meta name="theme-color" content="#0f3460">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
    <script src="../assets/js/components.js"></script>
    <script>document.write(LL.renderHeader('exams'));document.write(LL.renderSearchModal());</script>

    <main id="main-content">
        <section class="section">
            <div class="container">
                <nav class="breadcrumbs" aria-label="Breadcrumb"><a href="../index.html">Home</a><span>/</span><span>Exams</span></nav><h1 class="section-title">Competitive Exams</h1>
                <p class="section-subtitle">Find study material organized by your target examination</p>

                <div class="card-grid" id="exam-grid"></div>
            </div>
        </section>
    </main>

    <script>document.write(LL.renderFooter());</script>
    <script src="../assets/js/search.js" defer></script>
    <script>
    (function() {
        var exams = [
            { name:'UPSC', icon:'🏛️', desc:'Civil Services (IAS/IPS/IFS), CDS, NDA, CAPF, EPFO, Indian Forest Service', tags:['Prelims','Mains','Interview'], subjects:['General Studies','CSAT','Optional'], level:'National' },
            { name:'SSC', icon:'🏆', desc:'CGL, CHSL, MTS, CPO, Stenographer, GD Constable, JE, JHT', tags:['CGL','CHSL','MTS','CPO'], subjects:['Reasoning','Maths','English','GK'], level:'National' },
            { name:'Banking', icon:'🏦', desc:'IBPS PO/Clerk/SO, SBI PO/Clerk, RBI Grade B/Assistant, NABARD, SEBI', tags:['IBPS PO','SBI PO','RBI'], subjects:['Reasoning','Quant','English','GA','Banking Awareness'], level:'National' },
            { name:'GATE', icon:'⚙️', desc:'Graduate Aptitude Test in Engineering — CSE, ECE, EE, ME, CE, IN', tags:['CSE','ECE','EE','ME','CE'], subjects:['Core Subjects','Aptitude','Maths'], level:'National' },
            { name:'ESE/IES', icon:'🔧', desc:'Engineering Services Examination — Civil, Mechanical, Electrical, E&T', tags:['Prelims','Mains','Interview'], subjects:['Engineering','GS','English'], level:'National' },
            { name:'Railways', icon:'🚃', desc:'RRB NTPC, Group D, ALP/Technician, JE, Paramedical, Ministerial', tags:['NTPC','Group D','ALP','JE'], subjects:['Reasoning','Maths','GK','Science'], level:'National' },
            { name:'Defence', icon:'🎖️', desc:'CDS, NDA, AFCAT, Territorial Army, Indian Coast Guard, MNS', tags:['CDS','NDA','AFCAT'], subjects:['Maths','English','GK','SSB'], level:'National' },
            { name:'ISRO', icon:'🚀', desc:'ISRO Scientist/Engineer — Electronics, Computer Science, Mechanical', tags:['SC/Engineer','Technician'], subjects:['Core Engineering','Reasoning','English'], level:'National' },
            { name:'DRDO', icon:'🔬', desc:'DRDO CEPTAM — Senior Technical Assistant, Technician', tags:['STA','Technician'], subjects:['Core Subjects','GK','Maths'], level:'National' },
            { name:'BARC', icon:'⚛️', desc:'BARC OCES/DGFS — Scientific Officer, Engineer', tags:['OCES','DGFS'], subjects:['Core Engineering','Physics','Maths'], level:'National' },
            { name:'State PSC', icon:'📝', desc:'BPSC, UPPSC, MPPSC, RPSC, WBPSC, KPSC, TNPSC and more', tags:['State Services','Lower PCS'], subjects:['General Studies','State GK','Optional'], level:'State' },
            { name:'Teaching', icon:'🎓', desc:'UGC NET, CSIR NET, CTET, State TET, KVS, NVS, DSSSB', tags:['NET','TET','KVS'], subjects:['Education','Subject-specific','Child Dev.'], level:'National' }
        ];

        function render() {
            var grid = document.getElementById('exam-grid');
            if (!grid) return;
            grid.innerHTML = exams.map(function(ex) {
                return '<div class="exam-card"><div class="exam-icon" style="font-size:2.5rem">' + ex.icon + '</div>' +
                    '<h3>' + ex.name + '</h3>' +
                    '<p>' + ex.desc + '</p>' +
                    '<div class="exam-tags">' + ex.tags.map(function(t) { return '<span class="tag">' + t + '</span>'; }).join('') + '</div>' +
                    '<div style="margin-top:var(--space-sm);font-size:var(--text-xs);color:var(--c-text-muted)">' +
                    '<strong>Subjects:</strong> ' + ex.subjects.join(', ') + '</div></div>';
            }).join('');
        }

        document.addEventListener('DOMContentLoaded', function() { render(); LL.init(); });
    })();
    </script>
</body>
</html>
