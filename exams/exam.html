<!DOCTYPE html>
<html lang="en-IN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exam Details — Laurel Library</title>
    <meta name="description" content="Complete exam information — overview, eligibility, exam pattern, syllabus, important areas and preparation strategy for India's top competitive exams.">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self';">
    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="manifest" href="../manifest.json">
    <meta name="theme-color" content="#0f3460">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
    <script src="../assets/js/components.js"></script>
    <script>document.write(LL.renderHeader('exams'));document.write(LL.renderSearchModal());</script>

    <!-- Hero (exam title + summary) -->
    <section class="exam-hero" id="exam-hero">
        <div class="container">
            <div class="exam-hero-icon" id="hero-icon">🏛️</div>
            <h1 id="hero-name">Loading…</h1>
            <p class="exam-fullname" id="hero-fullname"></p>
            <div class="exam-hero-tags" id="hero-tags"></div>
        </div>
    </section>

    <!-- Sticky subjects bar -->
    <nav class="subjects-bar" id="subjects-bar" aria-label="Subjects for this exam" style="display:none">
        <div class="container subjects-bar-inner">
            <span class="subjects-bar-label">Subjects</span>
            <div class="chip-cloud" id="subjects-chips" style="flex-wrap:nowrap"></div>
        </div>
    </nav>

    <main id="main-content">
        <div class="container">
            <nav class="breadcrumbs" aria-label="Breadcrumb" style="margin-top:var(--space-6)">
                <a href="../index.html">Home</a><span>/</span>
                <a href="index.html">Exams</a><span>/</span>
                <span id="crumb-name">Exam</span>
            </nav>
            <div id="exam-body"></div>
        </div>
    </main>

    <script>document.write(LL.renderFooter());</script>
    <script src="../assets/js/exam-data.js"></script>
    <script src="../assets/js/search.js" defer></script>
    <script>
    (function() {
        function esc(s) { return LL.escapeHtml(s == null ? '' : String(s)); }

        var params = new URLSearchParams(window.location.search);
        var key = params.get('exam') || '';
        // Resolve exam by case-insensitive name match
        var data = LL.examData[key];
        if (!data) {
            var lower = key.toLowerCase();
            Object.keys(LL.examData).forEach(function(k) {
                if (k.toLowerCase() === lower) data = LL.examData[k];
            });
        }

        function renderNotFound() {
            document.getElementById('hero-name').textContent = 'Exam not found';
            document.getElementById('hero-fullname').textContent = 'Pick an exam from the list to see full details.';
            document.getElementById('exam-body').innerHTML =
                '<div class="empty-state"><div class="empty-icon">🔍</div><h3>No details available</h3>' +
                '<p>We couldn\'t find that exam. Browse all exams to continue.</p>' +
                '<p style="margin-top:var(--space-4)"><a href="index.html" class="btn btn-primary">← All Exams</a></p></div>';
        }

        function renderHero(d) {
            document.title = d.name + ' Exam — Details, Syllabus & Pattern — Laurel Library';
            document.getElementById('hero-icon').textContent = d.icon;
            document.getElementById('hero-name').textContent = d.name;
            document.getElementById('hero-fullname').textContent = d.fullName;
            document.getElementById('crumb-name').textContent = d.name;
            var tags = [];
            if (d.level) tags.push(d.level);
            if (d.conductedBy) tags.push(d.conductedBy);
            if (d.frequency) tags.push(d.frequency);
            document.getElementById('hero-tags').innerHTML = tags.map(function(t) {
                return '<span class="tag">' + esc(t) + '</span>';
            }).join('');
        }

        function renderSubjectsBar(d, counts) {
            var bar = document.getElementById('subjects-bar');
            var wrap = document.getElementById('subjects-chips');
            if (!d.subjects || !d.subjects.length) { bar.style.display = 'none'; return; }
            wrap.innerHTML = d.subjects.map(function(id) {
                var nm = LL.subjectNames[id] || id;
                var ic = LL.subjectIcons[id] || '📚';
                var c = counts[id] || 0;
                var badge = c > 0
                    ? '<span class="chip-count">' + c + '</span>'
                    : '<span class="chip-count" style="background:var(--c-text-muted)">0</span>';
                var muted = c > 0 ? '' : ' muted';
                var href = '../notes/index.html?exam=' + encodeURIComponent(d.name) + '&category=' + encodeURIComponent(id);
                return '<a class="subject-chip' + muted + '" href="' + href + '"><span>' + ic + '</span>' +
                    '<span>' + esc(nm) + '</span>' + badge + '</a>';
            }).join('');
            bar.style.display = '';
        }

        function section(title, inner) {
            return '<section class="exam-section"><h2>' + title + '</h2>' + inner + '</section>';
        }

        function renderBody(d) {
            var html = '';

            // Overview
            html += section('📋 Overview', '<p>' + esc(d.overview) + '</p>');

            // Quick facts
            var facts = [
                ['Conducting Body', d.conductedBy],
                ['Level', d.level],
                ['Frequency', d.frequency]
            ].filter(function(f) { return f[1]; });
            html += section('⚡ Quick Facts', '<div class="quick-facts">' + facts.map(function(f) {
                return '<div class="fact"><div class="fact-label">' + esc(f[0]) + '</div><div class="fact-value">' + esc(f[1]) + '</div></div>';
            }).join('') + '</div>');

            // Eligibility
            if (d.eligibility) {
                var e = d.eligibility;
                var rows = [
                    ['Education', e.education],
                    ['Age Limit', e.age],
                    ['Nationality', e.nationality],
                    ['Attempts', e.attempts]
                ].filter(function(r) { return r[1]; });
                html += section('✅ Eligibility', '<div class="info-list">' + rows.map(function(r) {
                    return '<div class="info-row"><span class="info-key">' + esc(r[0]) + '</span><span>' + esc(r[1]) + '</span></div>';
                }).join('') + '</div>');
            }

            // Stages
            if (d.stages && d.stages.length) {
                html += section('🪜 Selection Stages', '<div class="stage-list">' + d.stages.map(function(s) {
                    return '<div class="stage-card"><h4>' + esc(s.name) + '</h4><p>' + esc(s.detail) + '</p></div>';
                }).join('') + '</div>');
            }

            // Exam Pattern
            if (d.pattern && d.pattern.length) {
                html += section('📝 Exam Pattern', '<ul class="bullet-list">' + d.pattern.map(function(p) {
                    return '<li>' + esc(p) + '</li>';
                }).join('') + '</ul>');
            }

            // Syllabus
            if (d.syllabus && d.syllabus.length) {
                html += section('📚 Syllabus', d.syllabus.map(function(blk) {
                    return '<div class="syllabus-block"><h4>' + esc(blk.area) + '</h4><ul class="bullet-list">' +
                        blk.points.map(function(pt) { return '<li>' + esc(pt) + '</li>'; }).join('') + '</ul></div>';
                }).join(''));
            }

            // Important areas
            if (d.importantAreas && d.importantAreas.length) {
                html += section('🎯 High-Priority Areas', '<div class="chip-cloud">' + d.importantAreas.map(function(a) {
                    return '<span class="tag tag-accent">' + esc(a) + '</span>';
                }).join('') + '</div>');
            }

            // Posts / opportunities
            if (d.posts && d.posts.length) {
                html += section('💼 Posts & Opportunities', '<ul class="bullet-list">' + d.posts.map(function(p) {
                    return '<li>' + esc(p) + '</li>';
                }).join('') + '</ul>');
            }

            // Strategy
            if (d.strategy && d.strategy.length) {
                html += section('🚀 Preparation Strategy', '<ul class="bullet-list">' + d.strategy.map(function(s) {
                    return '<li>' + esc(s) + '</li>';
                }).join('') + '</ul>');
            }

            // CTA
            html += '<section class="exam-section"><div class="callout"><strong>Ready to start?</strong> ' +
                'Pick a subject from the bar above to jump straight into study notes for ' + esc(d.name) + ', ' +
                'or <a href="../notes/index.html?exam=' + encodeURIComponent(d.name) + '">browse all ' + esc(d.name) + ' notes</a>.</div></section>';

            document.getElementById('exam-body').innerHTML = html;
        }

        function init() {
            if (!data) { renderNotFound(); LL.init(); return; }
            renderHero(data);
            renderBody(data);
            // counts for subject chips
            var counts = {};
            fetch('../notes/index.json')
                .then(function(r) { return r.ok ? r.json() : { notes: [] }; })
                .then(function(j) {
                    (j.notes || []).forEach(function(n) {
                        if (n.category) counts[n.category] = (counts[n.category] || 0) + 1;
                    });
                })
                .catch(function() {})
                .then(function() { renderSubjectsBar(data, counts); LL.init(); });
        }

        document.addEventListener('DOMContentLoaded', init);
    })();
    </script>
</body>
</html>
