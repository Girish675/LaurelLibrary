<!DOCTYPE html>
<html lang="en-IN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Study Planner — Laurel Library</title>
    <meta name="description" content="Free study planner and revision scheduler. Set daily targets, track progress by subject, and maintain consistency in your exam preparation.">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self';">
    <link rel="canonical" href="https://girish675.github.io/LaurelLibrary/tools/planner.html">
    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="manifest" href="../manifest.json">
    <meta name="theme-color" content="#1a202c">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
    <script src="../assets/js/components.js"></script>
    <script>document.write(LL.renderHeader('tools'));document.write(LL.renderSearchModal());</script>

    <main id="main-content">
        <section class="section">
            <div class="container" style="max-width:800px">
                <nav class="breadcrumbs" aria-label="Breadcrumb"><a href="../index.html">Home</a><span>/</span><a href="index.html">Tools</a><span>/</span><span>Study Planner</span></nav><h1 class="section-title">📅 Study Planner</h1>
                <p class="section-subtitle">Plan your daily study tasks and track completion</p>

                <!-- Add Task -->
                <div style="background:var(--c-bg-alt);padding:var(--space-lg);border-radius:var(--radius-lg);margin:var(--space-lg) 0">
                    <h3 style="margin:0 0 var(--space-md)">Add Study Task</h3>
                    <div style="display:grid;grid-template-columns:1fr auto auto;gap:var(--space-sm);align-items:end">
                        <div>
                            <label style="font-size:var(--text-sm);font-weight:500;display:block;margin-bottom:var(--space-xs)">Task</label>
                            <input type="text" id="plan-task" placeholder="e.g. Complete Geography Chapter 3" class="input" maxlength="200">
                        </div>
                        <div>
                            <label style="font-size:var(--text-sm);font-weight:500;display:block;margin-bottom:var(--space-xs)">Subject</label>
                            <select id="plan-subject" class="input">
                                <option>Geography</option><option>History</option><option>Polity</option>
                                <option>Economics</option><option>Science</option><option>Mathematics</option>
                                <option>Reasoning</option><option>English</option><option>Current Affairs</option>
                                <option>GK</option><option>Aptitude</option><option>Other</option>
                            </select>
                        </div>
                        <button type="button" class="btn btn-primary" id="plan-add">Add</button>
                    </div>
                </div>

                <!-- Today's Tasks -->
                <div style="margin:var(--space-lg) 0">
                    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:var(--space-md)">
                        <h2 style="font-size:var(--text-lg);margin:0">Today's Tasks</h2>
                        <span id="plan-date" style="color:var(--c-text-muted);font-size:var(--text-sm)"></span>
                    </div>
                    <div id="plan-progress" style="margin-bottom:var(--space-md)">
                        <div style="display:flex;justify-content:space-between;font-size:var(--text-sm);color:var(--c-text-secondary);margin-bottom:var(--space-xs)">
                            <span id="plan-status">0/0 completed</span>
                            <span id="plan-pct">0%</span>
                        </div>
                        <div class="xp-bar"><div class="xp-fill" id="plan-fill" style="width:0%"></div></div>
                    </div>
                    <div id="plan-list"></div>
                </div>

                <!-- Actions -->
                <div style="display:flex;gap:var(--space-sm);margin:var(--space-lg) 0">
                    <button type="button" class="btn btn-sm" id="plan-clear-done" style="color:var(--c-text-muted)">Clear Completed</button>
                    <button type="button" class="btn btn-sm" id="plan-clear-all" style="color:var(--c-error);margin-left:auto">Clear All</button>
                </div>
            </div>
        </section>
    </main>

    <script>document.write(LL.renderFooter());</script>
    <script src="../assets/js/search.js" defer></script>
    <script>
    (function() {
        var today = new Date().toISOString().split('T')[0];
        var KEY = 'll-planner-' + today;

        function getTasks() { return JSON.parse(localStorage.getItem(KEY) || '[]'); }
        function saveTasks(tasks) { localStorage.setItem(KEY, JSON.stringify(tasks)); }

        function render() {
            var tasks = getTasks();
            document.getElementById('plan-date').textContent = new Date().toLocaleDateString('en-IN', { weekday:'long', year:'numeric', month:'long', day:'numeric' });

            var list = document.getElementById('plan-list');
            if (tasks.length === 0) {
                list.innerHTML = '<div class="empty-state"><div class="empty-icon">📋</div><h3>No tasks for today</h3><p>Add study tasks above to plan your day.</p></div>';
            } else {
                list.innerHTML = tasks.map(function(t, i) {
                    return '<div style="display:flex;align-items:center;gap:var(--space-sm);padding:var(--space-sm) var(--space-md);background:var(--c-bg-alt);border-radius:var(--radius-md);margin-bottom:var(--space-xs);' + (t.done ? 'opacity:0.6' : '') + '">' +
                        '<input type="checkbox" ' + (t.done ? 'checked' : '') + ' data-idx="' + i + '" class="plan-check" style="width:18px;height:18px;cursor:pointer">' +
                        '<div style="flex:1;' + (t.done ? 'text-decoration:line-through' : '') + '">' +
                        '<div style="font-weight:500">' + LL.escapeHtml(t.text) + '</div>' +
                        '<div style="font-size:var(--text-xs);color:var(--c-text-muted)">' + LL.escapeHtml(t.subject) + '</div></div>' +
                        '<button type="button" class="plan-delete" data-idx="' + i + '" style="background:none;border:none;color:var(--c-text-muted);cursor:pointer;font-size:1.2rem" title="Delete">✕</button></div>';
                }).join('');

                list.querySelectorAll('.plan-check').forEach(function(cb) {
                    cb.addEventListener('change', function() {
                        var idx = parseInt(cb.getAttribute('data-idx'), 10);
                        var tasks = getTasks();
                        tasks[idx].done = cb.checked;
                        saveTasks(tasks);
                        if (cb.checked) LL.xp.add(5, 'Completed a study task');
                        render();
                    });
                });
                list.querySelectorAll('.plan-delete').forEach(function(btn) {
                    btn.addEventListener('click', function() {
                        var idx = parseInt(btn.getAttribute('data-idx'), 10);
                        var tasks = getTasks();
                        tasks.splice(idx, 1);
                        saveTasks(tasks);
                        render();
                    });
                });
            }

            // Progress
            var done = tasks.filter(function(t) { return t.done; }).length;
            var pct = tasks.length > 0 ? Math.round(done / tasks.length * 100) : 0;
            document.getElementById('plan-status').textContent = done + '/' + tasks.length + ' completed';
            document.getElementById('plan-pct').textContent = pct + '%';
            document.getElementById('plan-fill').style.width = pct + '%';
        }

        document.addEventListener('DOMContentLoaded', function() {
            LL.init();
            render();

            document.getElementById('plan-add').addEventListener('click', function() {
                var text = document.getElementById('plan-task').value.trim();
                var subject = document.getElementById('plan-subject').value;
                if (!text) { LL.toast('Please enter a task', 'warning'); return; }
                var tasks = getTasks();
                tasks.push({ text: text, subject: subject, done: false });
                saveTasks(tasks);
                document.getElementById('plan-task').value = '';
                LL.toast('Task added!', 'success');
                render();
            });

            document.getElementById('plan-task').addEventListener('keydown', function(e) {
                if (e.key === 'Enter') document.getElementById('plan-add').click();
            });

            document.getElementById('plan-clear-done').addEventListener('click', function() {
                var tasks = getTasks().filter(function(t) { return !t.done; });
                saveTasks(tasks); render();
            });

            document.getElementById('plan-clear-all').addEventListener('click', function() {
                if (confirm('Clear all tasks for today?')) { saveTasks([]); render(); }
            });
        });
    })();
    </script>
</body>
</html>
