<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Geography Notes - Laurel Library</title>
    <link rel="stylesheet" href="../../assets/css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Source+Sans+3:wght@300;400;500;600&display=swap" rel="stylesheet">
</head>
<body>
    <header class="site-header">
        <div class="container">
            <div class="logo">
                <span class="logo-icon">&#128218;</span>
                <h1>Laurel Library</h1>
            </div>
            <nav class="main-nav">
                <a href="../../index.html">Home</a>
                <a href="../index.html" class="active">Notes</a>
                <a href="../../about.html">About</a>
            </nav>
            <div class="search-bar">
                <input type="text" id="search-input" placeholder="Search notes..." autocomplete="off">
                <div id="search-results" class="search-results"></div>
            </div>
        </div>
    </header>

    <main>
        <div class="container" style="padding: 40px 20px;">
            <div class="breadcrumbs">
                <a href="../../index.html">Home</a>
                <span>&rsaquo;</span>
                <a href="../index.html">Notes</a>
                <span>&rsaquo;</span>
                Geography
            </div>

            <h2 class="section-title">Geography Notes</h2>
            <div class="notes-list" id="category-notes"></div>
        </div>
    </main>

    <footer class="site-footer">
        <div class="container">
            <p>&copy; 2026 Laurel Library. Free educational resource for competitive exam aspirants.</p>
        </div>
    </footer>

    <script>
        async function loadCategoryNotes() {
            try {
                const response = await fetch('../index.json');
                const data = await response.json();
                const container = document.getElementById('category-notes');
                
                const notes = data.notes.filter(function(n) { return n.category === 'geography'; });
                
                if (notes.length === 0) {
                    container.innerHTML = '<p>No notes in this category yet.</p>';
                    return;
                }

                container.innerHTML = notes.map(function(note) {
                    var filename = note.path.split('/').pop();
                    return '<a href="' + filename + '" class="note-card">' +
                        '<h4>' + note.title + '</h4>' +
                        '<div class="meta">' + (note.exam || 'General') + '</div>' +
                    '</a>';
                }).join('');
            } catch (e) {
                document.getElementById('category-notes').innerHTML = '<p>No notes available yet.</p>';
            }
        }
        document.addEventListener('DOMContentLoaded', loadCategoryNotes);
    </script>
    <script src="../../assets/js/search.js"></script>
</body>
</html>
