<!DOCTYPE html>
<html lang="en-IN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self';">
    <title>Geography Notes — Laurel Library</title>
    <meta name="description" content="Geography study notes for competitive exam preparation — physical, human, economic & Indian geography. Free on Laurel Library.">
    <link rel="stylesheet" href="../../assets/css/style.css">
    <link rel="manifest" href="../../manifest.json">
    <meta name="theme-color" content="#1a202c">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
    <script src="../../assets/js/components.js"></script>
    <script>document.write(LL.renderHeader('notes'));document.write(LL.renderSearchModal());</script>

    <main id="main-content">
        <section class="section">
            <div class="container">
                <nav class="breadcrumbs" aria-label="Breadcrumb">
                    <a href="../../index.html">Home</a><span>/</span>
                    <a href="../index.html">Notes</a><span>/</span>
                    <span>Geography</span>
                </nav><h1 class="section-title">🌍 Geography</h1>
                <p class="section-subtitle">Physical, human, economic & Indian geography notes</p>
                <div id="notes-count" style="margin:var(--space-md) 0;color:var(--c-text-muted);font-size:var(--text-sm)"></div>
                <div class="notes-grid" id="category-notes">
                    <div class="skeleton skeleton-card"></div>
                    <div class="skeleton skeleton-card"></div>
                    <div class="skeleton skeleton-card"></div>
                </div>
            </div>
        </section>
    </main>

    <script>document.write(LL.renderFooter());</script>
    <script src="../../assets/js/search.js" defer></script>
    <script>
        (function() {
            document.addEventListener('DOMContentLoaded', function() {
                LL.init();
                fetch('../../notes/index.json')
                    .then(function(r) { return r.json(); })
                    .then(function(data) {
                        var container = document.getElementById('category-notes');
                        var notes = (data.notes || []).filter(function(n) { return n.category === 'geography'; });
                        document.getElementById('notes-count').textContent = notes.length + ' notes';
                        if (notes.length === 0) {
                            container.innerHTML = '<div class="empty-state"><div class="empty-icon">🌍</div><h3>No geography notes yet</h3></div>';
                            return;
                        }
                        container.innerHTML = notes.map(function(note) {
                            var href = note.path.replace('notes/geography/', '');
                            return '<a href="' + href + '" class="note-card"><h4>' + LL.escapeHtml(note.title) + '</h4>' +
                                '<div class="meta"><span class="tag">Geography</span><span>' + LL.escapeHtml(note.exam || 'General') + '</span></div></a>';
                        }).join('');
                    });
            });
        })();
    </script>
</body>
</html>
