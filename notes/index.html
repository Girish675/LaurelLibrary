<!DOCTYPE html>
<html lang="en-IN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All Study Notes - Laurel Library | Competitive Exam Preparation</title>
    <meta name="description" content="Browse all free study notes on Laurel Library. Geography, History, Polity, Science, Mathematics and more for UPSC, SSC, GATE, JEE, NEET preparation.">
    <meta name="robots" content="index, follow">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self';">
    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="manifest" href="../manifest.json">
    <meta name="theme-color" content="#5c3d2e">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Source+Sans+3:wght@300;400;500;600&display=swap" rel="stylesheet">
</head>
<body>
    <a href="#main-content" class="skip-link">Skip to main content</a>
    <header class="site-header" role="banner">
        <div class="container">
            <div class="logo">
                <a href="../index.html" style="display:flex;align-items:center;gap:10px;text-decoration:none;">
                    <span class="logo-icon">&#128218;</span>
                    <h1>Laurel Library</h1>
                </a>
            </div>
            <nav class="main-nav" role="navigation" aria-label="Main navigation">
                <a href="../index.html">Home</a>
                <a href="index.html" class="active" aria-current="page">Notes</a>
                <a href="../exams/index.html">Exams</a>
                <a href="../about.html">About</a>
            </nav>
            <div class="header-actions">
                <button class="theme-toggle" id="theme-toggle" title="Toggle dark mode" aria-label="Toggle dark mode">
                    <span class="icon-sun">&#9728;&#65039;</span>
                    <span class="icon-moon">&#127769;</span>
                </button>
                <div class="search-bar">
                    <input type="text" id="search-input" placeholder="Search notes..." autocomplete="off" aria-label="Search notes" role="searchbox">
                    <div id="search-results" class="search-results"></div>
                </div>
            </div>
        </div>
    </header>

    <main id="main-content">
        <div class="container" style="padding: 40px 20px;">
            <h2 class="section-title">All Notes</h2>
            <div class="notes-list" id="all-notes"></div>
        </div>
    </main>

    <footer class="site-footer" role="contentinfo">
        <div class="container">
            <p>&copy; 2026 Laurel Library. Free educational resource for competitive exam aspirants.</p>
        </div>
    </footer>

    <script>
        async function loadNotes() {
            try {
                const response = await fetch('index.json');
                const data = await response.json();
                const container = document.getElementById('all-notes');
                
                if (!data.notes || data.notes.length === 0) {
                    container.innerHTML = '<p>No notes available yet.</p>';
                    return;
                }

                container.innerHTML = data.notes.map(function(note) {
                    return '<a href="../' + note.path + '" class="note-card">' +
                        '<h4>' + note.title + '</h4>' +
                        '<div class="meta">' + note.category.replace('-', ' ') + ' &bull; ' + (note.exam || 'General') + '</div>' +
                    '</a>';
                }).join('');
            } catch (e) {
                document.getElementById('all-notes').innerHTML = '<p>No notes available yet.</p>';
            }
        }
        document.addEventListener('DOMContentLoaded', loadNotes);
    </script>
    <script src="../assets/js/search.js" defer></script>
    <script src="../assets/js/features.js" defer></script>
</body>
</html>
