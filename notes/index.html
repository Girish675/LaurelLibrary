<!DOCTYPE html>
<html lang="en-IN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All Study Notes — Laurel Library</title>
    <meta name="description" content="Browse all free study notes on Laurel Library. Geography, History, Polity, Science, Mathematics and more for competitive exam preparation.">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self';">
    <link rel="canonical" href="https://girish675.github.io/LaurelLibrary/notes/">
    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="manifest" href="../manifest.json">
    <meta name="theme-color" content="#0f3460">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
    <script src="../assets/js/components.js"></script>
    <script>document.write(LL.renderHeader('notes'));document.write(LL.renderSearchModal());</script>

    <main id="main-content">
        <section class="section">
            <div class="container">
                <nav class="breadcrumbs" aria-label="Breadcrumb"><a href="../index.html">Home</a><span>/</span><span>Notes</span></nav><h1 class="section-title">Study Notes</h1>
                <p class="section-subtitle">Browse all available study material organized by subject</p>

                <div id="exam-banner"></div>

                <div class="tabs" id="notes-tabs" role="tablist">
                    <button type="button" class="tab active" role="tab" data-filter="all" aria-selected="true">All</button>
                </div>

                <div id="notes-count" style="margin:var(--space-md) 0;color:var(--c-text-muted);font-size:var(--text-sm)"></div>
                <div class="notes-grid" id="notes-list">
                    <div class="skeleton skeleton-card"></div>
                    <div class="skeleton skeleton-card"></div>
                    <div class="skeleton skeleton-card"></div>
                </div>
            </div>
        </section>
    </main>

    <script>document.write(LL.renderFooter());</script>
    <script src="../assets/js/search.js" defer></script>
    <script>
    (function() {
        var notes = [], activeFilter = 'all', examFilter = null;

        function examMatches(noteExam, examName) {
            if (!noteExam) return false;
            var tokens = noteExam.split(',').map(function(t) { return t.trim().toLowerCase(); });
            var target = examName.toLowerCase();
            return tokens.some(function(t) { return t === target || t.indexOf(target) !== -1 || target.indexOf(t) !== -1; });
        }

        async function init() {
            try {
                var r = await fetch('index.json');
                if (r.ok) { var d = await r.json(); notes = d.notes || []; }
            } catch(e) {}
            var params = new URLSearchParams(window.location.search);
            examFilter = params.get('exam');
            var catParam = params.get('category');
            if (catParam) activeFilter = catParam;
            renderExamBanner();
            buildTabs();
            renderNotes();
            LL.init();
        }

        function renderExamBanner() {
            var banner = document.getElementById('exam-banner');
            if (!banner) return;
            var label = null;
            if (examFilter) label = examFilter;
            else if (activeFilter !== 'all') label = activeFilter.charAt(0).toUpperCase() + activeFilter.slice(1).replace(/-/g, ' ');
            if (!label) { banner.innerHTML = ''; return; }
            banner.innerHTML = '<div style="display:flex;align-items:center;justify-content:space-between;gap:var(--space-3);flex-wrap:wrap;' +
                'background:rgba(15,52,96,0.06);border:1px solid var(--c-border);border-radius:var(--radius-md);' +
                'padding:var(--space-3) var(--space-4);margin-bottom:var(--space-4)">' +
                '<span style="font-weight:600;color:var(--c-primary)">Showing notes for <strong>' + LL.escapeHtml(label) + '</strong></span>' +
                '<a href="index.html" class="tag" style="text-decoration:none">✕ Clear filter</a></div>';
        }

        function buildTabs() {
            var cats = new Set();
            var pool = examFilter ? notes.filter(function(n) { return examMatches(n.exam, examFilter); }) : notes;
            pool.forEach(function(n) { cats.add(n.category); });
            var tabs = document.getElementById('notes-tabs');
            if (!tabs) return;
            cats.forEach(function(c) {
                var btn = document.createElement('button');
                btn.type = 'button';
                btn.className = 'tab';
                btn.setAttribute('role', 'tab');
                btn.setAttribute('data-filter', c);
                if (c === activeFilter) { btn.classList.add('active'); btn.setAttribute('aria-selected','true'); }
                btn.textContent = c.charAt(0).toUpperCase() + c.slice(1).replace(/-/g, ' ');
                tabs.appendChild(btn);
            });
            // sync the "All" tab active state
            var allTab = tabs.querySelector('[data-filter="all"]');
            if (allTab && activeFilter !== 'all') { allTab.classList.remove('active'); allTab.setAttribute('aria-selected','false'); }
            tabs.addEventListener('click', function(e) {
                if (e.target.classList.contains('tab')) {
                    tabs.querySelectorAll('.tab').forEach(function(t) { t.classList.remove('active'); t.setAttribute('aria-selected','false'); });
                    e.target.classList.add('active');
                    e.target.setAttribute('aria-selected','true');
                    activeFilter = e.target.getAttribute('data-filter');
                    renderExamBanner();
                    renderNotes();
                }
            });
        }

        function renderNotes() {
            var list = document.getElementById('notes-list');
            var count = document.getElementById('notes-count');
            if (!list) return;
            var filtered = notes;
            if (examFilter) filtered = filtered.filter(function(n) { return examMatches(n.exam, examFilter); });
            if (activeFilter !== 'all') filtered = filtered.filter(function(n) { return n.category === activeFilter; });
            if (count) count.textContent = filtered.length + ' note' + (filtered.length !== 1 ? 's' : '');
            if (filtered.length === 0) {
                var msg = examFilter
                    ? 'Notes for <strong>' + LL.escapeHtml(examFilter) + '</strong> are coming soon. Meanwhile, explore <a href="index.html">all notes</a>.'
                    : 'Notes for this category are coming soon.';
                list.innerHTML = '<div class="empty-state"><div class="empty-icon">📚</div><h3>No notes found</h3><p>' + msg + '</p></div>';
                return;
            }
            list.innerHTML = filtered.map(function(n) {
                var cat = n.category.charAt(0).toUpperCase() + n.category.slice(1).replace(/-/g, ' ');
                return '<a href="../' + n.path + '" class="note-card"><h4>' + LL.escapeHtml(n.title) + '</h4>' +
                    '<div class="meta"><span class="tag">' + LL.escapeHtml(cat) + '</span>' +
                    '<span>' + LL.escapeHtml(n.exam || 'General') + '</span></div></a>';
            }).join('');
        }

        document.addEventListener('DOMContentLoaded', init);
    })();
    </script>
</body>
</html>
