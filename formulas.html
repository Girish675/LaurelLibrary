<!DOCTYPE html>
<html lang="en-IN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formula Sheets — Laurel Library</title>
    <meta name="description" content="Quick-reference formula sheets for Mathematics, Physics, and quantitative subjects. Auto-extracted key formulas from study notes.">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self';">
    <link rel="canonical" href="https://girish675.github.io/LaurelLibrary/formulas.html">
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1a202c">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
    <script src="assets/js/components.js"></script>
    <script>document.write(LL.renderHeader('resources'));document.write(LL.renderSearchModal());</script>

    <main id="main-content">
        <section class="section">
            <div class="container">
                <div class="breadcrumbs" aria-label="Breadcrumb"><a href="index.html">Home</a><span>/</span><a href="resources/index.html">Resources</a><span>/</span><span>Formula Sheets</span></div>
                <h1 class="section-title">📋 Formula Sheets</h1>
                <p class="section-subtitle">Key formulas extracted from study notes for quick revision</p>

                <div id="formula-loading" class="empty-state">
                    <div class="empty-icon">📋</div>
                    <h3>Loading formulas...</h3>
                </div>

                <div id="formula-content" style="display:none">
                    <div id="formula-count" style="margin:var(--space-md) 0;color:var(--c-text-muted);font-size:var(--text-sm)"></div>
                    <div id="formula-list" class="article-body"></div>
                </div>

                <div id="formula-empty" class="empty-state" style="display:none">
                    <div class="empty-icon">📋</div>
                    <h3>No formulas found</h3>
                    <p>Formula sheets will be generated as more quantitative content is added.</p>
                </div>
            </div>
        </section>
    </main>

    <script>document.write(LL.renderFooter());</script>
    <script src="assets/js/search.js" defer></script>
    <script>
    (function() {
        async function init() {
            LL.init();
            try {
                var r = await fetch('notes/index.json');
                if (!r.ok) throw new Error();
                var data = await r.json();
                var notes = data.notes || [];
                if (notes.length === 0) {
                    document.getElementById('formula-loading').style.display = 'none';
                    document.getElementById('formula-empty').style.display = 'block';
                    return;
                }
                // Try to extract formulas from notes by fetching them
                var allFormulas = [];
                var fetched = 0;
                var total = Math.min(notes.length, 20); // Limit to prevent too many requests
                
                for (var i = 0; i < total; i++) {
                    try {
                        var nr = await fetch(notes[i].path);
                        if (!nr.ok) continue;
                        var html = await nr.text();
                        var parser = new DOMParser();
                        var doc = parser.parseFromString(html, 'text/html');
                        var article = doc.getElementById('article-content') || doc.querySelector('.article-content') || doc.querySelector('main');
                        if (!article) continue;
                        
                        // Find formulas: text containing =, numbers with units, or strong tags with numbers
                        article.querySelectorAll('strong, b, li').forEach(function(el) {
                            var text = el.textContent.trim();
                            if (text.length > 5 && text.length < 200 && (/[=×÷±²³]/.test(text) || /\d+.*(?:km|m|cm|mm|°|%|kg|g|ml|l|sq|cu)/i.test(text))) {
                                allFormulas.push({ text: text, source: notes[i].title, category: notes[i].category });
                            }
                        });
                    } catch(e) {}
                }

                document.getElementById('formula-loading').style.display = 'none';
                if (allFormulas.length === 0) {
                    document.getElementById('formula-empty').style.display = 'block';
                    return;
                }

                document.getElementById('formula-content').style.display = 'block';
                document.getElementById('formula-count').textContent = allFormulas.length + ' formulas/key facts found';

                // Group by category
                var groups = {};
                allFormulas.forEach(function(f) {
                    var cat = f.category || 'General';
                    if (!groups[cat]) groups[cat] = [];
                    groups[cat].push(f);
                });

                var html = '';
                for (var cat in groups) {
                    var catName = cat.charAt(0).toUpperCase() + cat.slice(1).replace(/-/g, ' ');
                    html += '<h2 style="margin-top:var(--space-xl)">' + LL.escapeHtml(catName) + '</h2>';
                    html += '<div style="display:grid;gap:var(--space-xs)">';
                    groups[cat].forEach(function(f) {
                        html += '<div style="padding:var(--space-sm) var(--space-md);background:var(--c-bg-alt);border-radius:var(--radius-md);border-left:3px solid var(--c-primary)">' +
                            '<div style="font-weight:500">' + LL.escapeHtml(f.text) + '</div>' +
                            '<div style="font-size:var(--text-xs);color:var(--c-text-muted);margin-top:2px">From: ' + LL.escapeHtml(f.source) + '</div></div>';
                    });
                    html += '</div>';
                }
                document.getElementById('formula-list').innerHTML = html;

            } catch(e) {
                document.getElementById('formula-loading').style.display = 'none';
                document.getElementById('formula-empty').style.display = 'block';
            }
        }
        document.addEventListener('DOMContentLoaded', init);
    })();
    </script>
</body>
</html>
